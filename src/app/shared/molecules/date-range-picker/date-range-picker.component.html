<div class="date-range-wrapper">
  <i class="pi pi-chevron-down dropdown-icon"></i>
  <p-datepicker
    [(ngModel)]="$dateRange"
    selectionMode="range"
    [showIcon]="true"
    [iconDisplay]="'input'"
    dateFormat="dd/mm/yy"
    placeholder="בחר טווח תאריכים"
    [style]="{ width: '100%' }"
    styleClass="rounded-datepicker"
  />
</div>
