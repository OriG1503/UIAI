<div class="switch-container">
  <button
    type="button"
    class="switch-btn"
    [class.active]="$mode() === 'regular'"
    (click)="onModeSelect('regular')"
  >
    {{ labels.regular }}
  </button>
  <button
    type="button"
    class="switch-btn"
    [class.active]="$mode() === 'agent'"
    (click)="onModeSelect('agent')"
  >
    {{ labels.agent }}
  </button>
</div>
