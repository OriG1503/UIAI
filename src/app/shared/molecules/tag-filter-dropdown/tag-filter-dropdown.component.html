<div class="tag-filter-wrapper">
  <div class="input-container">
    <input
      type="text"
      class="tag-input"
      [ngModel]="$searchText()"
      (ngModelChange)="onInputChange($event)"
      (focus)="onInputFocus()"
      [placeholder]="$placeholder()"
    />
    <app-icon name="chevron-down" size="0.75rem" color="var(--color-navy-gray)" class="dropdown-icon" />
  </div>

  @if ($isDropdownOpen() && $filteredOptions().length > 0) {
    <div class="dropdown-list">
      @for (option of $filteredOptions(); track option.value) {
        <button type="button" class="dropdown-item" (click)="selectOption(option)">
          {{ option.label }}
        </button>
      }
    </div>
  }
</div>
