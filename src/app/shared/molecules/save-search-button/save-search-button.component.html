<div class="save-search-wrapper">
  <button type="button" class="save-btn" (click)="togglePopup()" title="שמור חיפוש">
    <i class="pi pi-save"></i>
  </button>

  @if ($isPopupOpen()) {
    <div class="popup-overlay" (click)="closePopup()"></div>
    <div class="popup-container">
      <input
        type="text"
        [(ngModel)]="$searchName"
        placeholder="שם החיפוש"
        class="name-input"
      />
      <button type="button" class="save-confirm-btn" (click)="onSave()">שמור</button>
    </div>
  }
</div>
