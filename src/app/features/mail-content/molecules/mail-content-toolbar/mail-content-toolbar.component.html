<div class="mail-content-toolbar">
  <div class="toolbar-right">
    <button type="button" class="icon-btn" (click)="onDownloadClick()">
      <app-icon name="download" size="0.875rem" color="var(--color-navy-gray)" />
    </button>
    <div class="nav-buttons">
      <button
        type="button"
        class="nav-btn"
        [disabled]="!$hasPrevious()"
        (click)="onPreviousClick()"
      >
        <app-icon name="chevron-left" size="0.875rem" [color]="$hasPrevious() ? 'var(--color-navy-gray)' : 'var(--color-light-gray)'" />
      </button>
      <button
        type="button"
        class="nav-btn"
        [disabled]="!$hasNext()"
        (click)="onNextClick()"
      >
        <app-icon name="chevron-right" size="0.875rem" [color]="$hasNext() ? 'var(--color-navy-gray)' : 'var(--color-light-gray)'" />
      </button>
    </div>
  </div>

  <div class="toolbar-left">
    <div class="encoding-wrapper">
      <button type="button" class="encoding-btn" (click)="onEncodingClick()">
        <span>{{ $selectedEncoding() === 'none' ? translations.encoding : encodingLabels[$selectedEncoding()] }}</span>
        <app-icon name="chevron-down" size="0.75rem" color="var(--color-navy-gray)" />
      </button>
      @if ($isEncodingPopupOpen()) {
        <div class="encoding-popup">
          @for (enc of encodings; track enc) {
            <button
              type="button"
              class="encoding-option"
              [class.selected]="$selectedEncoding() === enc"
              (click)="onEncodingSelect(enc)"
            >
              {{ encodingLabels[enc] }}
              @if ($selectedEncoding() === enc) {
                <app-icon name="check" size="0.75rem" color="var(--color-blue)" />
              }
            </button>
          }
        </div>
      }
    </div>
  </div>
</div>
