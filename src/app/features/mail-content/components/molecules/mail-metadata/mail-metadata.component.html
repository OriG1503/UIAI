<div class="mail-metadata">
  <div class="subject-row">
    <h2
      class="subject"
      dir="auto"
      [innerHTML]="$mail().subject | highlightText: $searchTerms()"
    ></h2>
    <div class="datetime">
      <span class="date">{{ $mail().sent | formatDate }}</span>
      <span class="time">{{ $mail().sent | formatTime }}</span>
    </div>
  </div>

  <div class="recipients">
    <div class="recipient-row">
      <div class="recipient-label">
        <app-icon
          [name]="ICON_NAMES.USER"
          [size]="ICON_SIZE_MD"
        />
        <span>From:</span>
      </div>
      <span
        class="recipient-value"
        dir="auto"
        [innerHTML]="($mail().from | formatUserInfo) | highlightText: $searchTerms()"
      ></span>
    </div>

    <div class="recipient-row">
      <div class="recipient-label">
        <app-icon
          [name]="ICON_NAMES.USERS"
          [size]="ICON_SIZE_MD"
        />
        <span>To:</span>
      </div>
      <span
        class="recipient-value"
        dir="auto"
        [innerHTML]="$toDisplay() | highlightText: $searchTerms()"
      ></span>
    </div>

    @if ($ccDisplay()) {
      <div class="recipient-row">
        <div class="recipient-label">
          <app-icon
            [name]="ICON_NAMES.COPY"
            [size]="ICON_SIZE_MD"
          />
          <span>CC:</span>
        </div>
        <span
          class="recipient-value"
          dir="auto"
          [innerHTML]="$ccDisplay() | highlightText: $searchTerms()"
        ></span>
      </div>
    }

    @if ($bccDisplay()) {
      <div class="recipient-row">
        <div class="recipient-label">
          <app-icon
            [name]="ICON_NAMES.EYE_SLASH"
            [size]="ICON_SIZE_MD"
          />
          <span>BCC:</span>
        </div>
        <span
          class="recipient-value"
          dir="auto"
          [innerHTML]="$bccDisplay() | highlightText: $searchTerms()"
        ></span>
      </div>
    }
  </div>
</div>
