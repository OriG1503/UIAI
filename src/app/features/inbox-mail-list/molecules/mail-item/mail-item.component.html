<div
  class="mail-item"
  [class.unseen]="$isUnseen()"
  [class.selected]="$isSelected()"
  [class.current]="$isCurrent()"
  (click)="onMailClick()"
  (contextmenu)="onContextMenu($event)"
>
  <div class="unseen-indicator"></div>

  @if ($isSelectMode()) {
    <div class="select-circle" [class.is-selected]="$isSelected()">
      @if ($isSelected()) {
        <app-icon [name]="ICON_NAMES.CHECK" size="0.75rem" color="var(--color-white)" />
      }
    </div>
  }

  <div class="mail-content">
    <div class="mail-header">
      <button type="button" class="star-btn" [class.starred]="$isStarred()" (click)="onStarClick($event)">
        <app-icon
          [name]="$isStarred() ? ICON_NAMES.STAR_FILL : ICON_NAMES.STAR"
          size="0.875rem"
          [color]="$isStarred() ? 'var(--color-orange)' : 'var(--color-dark-navy)'"
        />
      </button>

      <div class="mail-meta">
        <span class="mail-date">{{ $formattedDate() }}</span>
        <span class="mail-time">{{ $formattedTime() }}</span>
        @if ($attachmentCount() > 0) {
          <div class="attachment-badge" [class.highlight-attachment-badge]="$isAttachmentBadgeHighlighted()">
            <app-icon [name]="ICON_NAMES.PAPERCLIP" size="0.75rem" />
            <span class="attachment-count">{{ $attachmentCount() }}</span>
          </div>
        }
      </div>
    </div>

    <div class="mail-body">
      <div class="mail-subject" dir="auto" [innerHTML]="$mail().subject | highlightText:$searchTerms()"></div>
      <div class="mail-sender" dir="auto" [innerHTML]="$senderDisplay() | highlightText:$searchTerms()"></div>
      @if ($ccBccDisplay()) {
        <div class="mail-cc-bcc" [innerHTML]="$ccBccDisplay() | highlightText:$searchTerms()"></div>
      }
      @if ($preview()) {
        <div class="mail-preview">{{ $preview() }}</div>
      }
    </div>
  </div>
</div>
