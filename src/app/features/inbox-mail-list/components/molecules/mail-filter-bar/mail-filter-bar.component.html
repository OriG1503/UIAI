<div class="mail-filter-bar">
  <div class="filter-actions-right">
    <div class="translate-wrapper">
      <button type="button" class="icon-btn" (click)="onTranslateClick()">
        <app-icon [name]="ICON_NAMES.GLOBE" size="1rem" />
      </button>
      @if ($isLanguagePopupOpen()) {
        <div class="language-popup">
          @for (lang of languages; track lang) {
            <button
              type="button"
              class="language-option"
              [class.selected]="$selectedLanguage() === lang"
              (click)="onLanguageSelect(lang)"
            >
              {{ languageLabels[lang] }}
              @if ($selectedLanguage() === lang) {
                <app-icon [name]="ICON_NAMES.CHECK" size="0.75rem" color="var(--color-blue)" />
              }
            </button>
          }
        </div>
      }
    </div>

    <button type="button" class="icon-btn" [class.active]="$isSelectMode()" (click)="onExcelClick()">
      <app-icon [name]="ICON_NAMES.FILE_EXCEL" size="1rem" [color]="$isSelectMode() ? 'var(--color-blue)' : 'var(--color-dark-navy)'" />
    </button>

    @if ($isSelectMode() && $selectedCount() > 0) {
      <button type="button" class="export-btn" (click)="onExportClick()">
        {{ translations.export }}
      </button>
    }
  </div>

  <div class="filter-actions-left">
    <button type="button" class="icon-btn" (click)="onSortToggle()">
      <app-icon
        [name]="$sortDirection() === 'desc' ? ICON_NAMES.SORT_AMOUNT_DOWN : ICON_NAMES.SORT_AMOUNT_UP"
        size="1rem"
      />
    </button>

    <button
      type="button"
      class="icon-btn"
      [class.active]="$activeFilter() === 'starred'"
      (click)="onFilterClick('starred')"
    >
      <app-icon
        [name]="ICON_NAMES.STAR"
        size="1rem"
        [color]="$activeFilter() === 'starred' ? 'var(--color-orange)' : 'var(--color-dark-navy)'"
      />
    </button>

    <button
      type="button"
      class="icon-btn"
      [class.active]="$activeFilter() === 'unseen'"
      (click)="onFilterClick('unseen')"
    >
      <app-icon
        [name]="ICON_NAMES.ENVELOPE"
        size="1rem"
        [color]="$activeFilter() === 'unseen' ? 'var(--color-blue)' : 'var(--color-dark-navy)'"
      />
    </button>

    <button
      type="button"
      class="icon-btn"
      [class.active]="$activeFilter() === 'seen'"
      (click)="onFilterClick('seen')"
    >
      <app-icon
        [name]="ICON_NAMES.EYE"
        size="1rem"
        [color]="$activeFilter() === 'seen' ? 'var(--color-blue)' : 'var(--color-dark-navy)'"
      />
    </button>
  </div>
</div>
