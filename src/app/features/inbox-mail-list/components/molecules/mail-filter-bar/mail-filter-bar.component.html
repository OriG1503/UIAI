<div class="mail-filter-bar">
  <div class="filter-actions-right">
    <div class="translate-wrapper">
      <button type="button" class="icon-btn" [class.active]="$isLanguagePopupOpen()" [title]="translations.translateTooltip" (click)="onTranslateClick()">
        <app-icon [name]="ICON_NAMES.GLOBE" size="1rem" [color]="$isLanguagePopupOpen() ? 'var(--color-blue)' : 'var(--color-dark-navy)'" />
      </button>
      @if ($isLanguagePopupOpen()) {
        <div class="language-popup">
          @for (lang of languages; track lang) {
            <button
              type="button"
              class="language-option"
              [class.selected]="$selectedLanguage() === lang"
              (click)="onLanguageSelect(lang)"
            >
              {{ languageLabels[lang] }}
              @if ($selectedLanguage() === lang) {
                <app-icon [name]="ICON_NAMES.CHECK" size="0.75rem" color="var(--color-blue)" />
              }
            </button>
          }
        </div>
      }
    </div>

    <button
      type="button"
      class="icon-btn"
      [class.active]="$isSelectMode()"
      [title]="translations.exportTooltip"
      (click)="onExcelClick()"
    >
      <app-icon [name]="ICON_NAMES.FILE_EXCEL" size="1rem" [color]="$isSelectMode() ? 'var(--color-blue)' : 'var(--color-dark-navy)'" />
    </button>
    @if ($isSelectMode()) {
      <button
        type="button"
        class="export-btn"
        [class.disabled]="$selectedCount() === 0"
        [disabled]="$selectedCount() === 0"
        (click)="onExportClick()"
      >
        {{ translations.exportWithCount }} ({{ $selectedCount() }})
      </button>
    }
  </div>

  @if ($filteredCount() >= 0) {
    <span class="mail-count">({{ $filteredCount() }} {{ translations.mails }})</span>
  }

  <div class="filter-actions-left">
    <button
      type="button"
      class="icon-btn"
      [title]="$sortDirection() === 'desc' ? translations.sortNewToOld : translations.sortOldToNew"
      (click)="onSortToggle()"
    >
      <app-icon
        [name]="$sortDirection() === 'desc' ? ICON_NAMES.SORT_AMOUNT_DOWN : ICON_NAMES.SORT_AMOUNT_UP"
        size="1rem"
      />
    </button>

    <button
      type="button"
      class="icon-btn"
      [class.active]="$activeFilter() === 'unseen'"
      [title]="translations.unreadTooltip"
      (click)="onFilterClick('unseen')"
    >
      <app-icon
        [name]="ICON_NAMES.ENVELOPE"
        size="1rem"
        [color]="$activeFilter() === 'unseen' ? 'var(--color-blue)' : 'var(--color-dark-navy)'"
      />
    </button>

    <button
      type="button"
      class="icon-btn"
      [class.active]="$activeFilter() === 'seen'"
      [title]="translations.readTooltip"
      (click)="onFilterClick('seen')"
    >
      <app-icon
        [name]="ICON_NAMES.EYE"
        size="1rem"
        [color]="$activeFilter() === 'seen' ? 'var(--color-blue)' : 'var(--color-dark-navy)'"
      />
    </button>
  </div>
</div>
