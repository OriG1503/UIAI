<div
  class="context-menu"
  [style.left.px]="$adjustedX()"
  [style.top.px]="$adjustedY()"
>
  <button
    type="button"
    class="menu-item"
    (click)="onMarkAsUnread()"
  >
    <app-icon
      [name]="ICON_NAMES.ENVELOPE"
      [size]="ICON_SIZE_MD"
      color="var(--color-dark-navy)"
    />
    <span>{{ translations.markAsUnread }}</span>
  </button>
</div>
