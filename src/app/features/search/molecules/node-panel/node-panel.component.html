<div class="node-panel">
  <div class="filter-bubble">
    <div class="filter-group">
      <span class="filter-label">{{ translations.dateFilterLabel }}</span>
      <div class="filter-range-values">
        <span class="filter-range-min">{{ formatDate($dateRangeValues()[0]) }}</span>
        <span class="filter-range-max">{{ formatDate($dateRangeValues()[1]) }}</span>
      </div>
      <p-slider
        [min]="$dateMin()"
        [max]="$dateMax()"
        [ngModel]="$dateRangeValues()"
        (ngModelChange)="onDateRangeChange($event)"
        [range]="true"
        [step]="$dateStep()"
        [style]="{ width: '100%' }"
      />
    </div>

    <div class="filter-group">
      <span class="filter-label">{{ translations.mailCountFilterLabel }}</span>
      <div class="filter-range-values">
        <span class="filter-range-min">{{ $mailCountRangeValues()[0] }}</span>
        <span class="filter-range-max">{{ $mailCountRangeValues()[1] }}</span>
      </div>
      <p-slider
        [min]="$mailCountMin()"
        [max]="$mailCountMax()"
        [ngModel]="$mailCountRangeValues()"
        (ngModelChange)="onMailCountRangeChange($event)"
        [range]="true"
        [step]="1"
        [style]="{ width: '100%' }"
      />
    </div>
  </div>

  <div class="node-list-bubble">
    <div class="node-list-search">
      <app-icon
        name="search"
        size="0.85rem"
        color="var(--color-navy-gray)"
      />
      <input
        type="text"
        class="node-search-input"
        [placeholder]="translations.searchPlaceholder"
        [ngModel]="$searchText()"
        (ngModelChange)="onSearchChange($event)"
      />
    </div>

    <div class="sort-toggle">
      <button
        class="sort-button sort-button-right"
        [class.sort-button-active]="$sortMode() === 'mails'"
        (click)="onSortModeChange('mails')"
      >
        <app-icon
          [name]="$sortMode() === 'mails' && $sortDirection() === 'asc' ? 'sort-amount-up' : 'sort-amount-down'"
          size="0.7rem"
          [color]="$sortMode() === 'mails' ? 'var(--color-white)' : 'var(--color-navy-gray)'"
        />
        {{ translations.sortByMails }}
      </button>
      <button
        class="sort-button sort-button-left"
        [class.sort-button-active]="$sortMode() === 'rank'"
        (click)="onSortModeChange('rank')"
      >
        <app-icon
          [name]="$sortMode() === 'rank' && $sortDirection() === 'asc' ? 'sort-amount-up' : 'sort-amount-down'"
          size="0.7rem"
          [color]="$sortMode() === 'rank' ? 'var(--color-white)' : 'var(--color-navy-gray)'"
        />
        {{ translations.sortByRank }}
      </button>
    </div>

    <div class="node-list">
      @for (node of $filteredNodes(); track node.email) {
        <button
          class="node-item"
          [class.node-item-checked]="$selectedEmail() === node.email"
          (click)="onNodeClick(node.email)"
        >
          <span class="node-email">{{ node.email }}</span>
          @if ($sortMode() === 'mails') {
            <span class="node-count node-count-mail">{{ node.mailCount }}</span>
          } @else {
            <span class="node-count node-count-rank">{{ node.rank }}</span>
          }
        </button>
      }
    </div>
  </div>
</div>
