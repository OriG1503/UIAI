<div class="edge-filter">
  <span class="edge-filter-label">{{ translations.edgeFilterLabel }}</span>
  <div class="edge-filter-slider">
    <span class="edge-filter-value">{{ $rangeValues()[0] }}</span>
    <p-slider
      [min]="$min()"
      [max]="$max()"
      [ngModel]="$rangeValues()"
      (ngModelChange)="onRangeChange($event)"
      [range]="true"
      [style]="{ width: '100%' }"
    />
    <span class="edge-filter-value">{{ $rangeValues()[1] }}</span>
  </div>
</div>
