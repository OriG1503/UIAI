<div class="last-search-list">
  @for (search of $lastSearches(); track $index) {
    <div class="last-search-item">
      <div class="unseen-indicator"></div>

      <div class="item-content">
        <span class="last-search-type">{{ getSearchTypeLabel(search.searchType) }}</span>

        <span
          class="last-search-date"
          dir="ltr"
        >{{ formatDate(search.date) }}</span>

        <span
          class="last-search-time"
          dir="ltr"
        >{{ formatTime(search.date) }}</span>

        <button
          type="button"
          class="play-btn"
        >
          <app-icon
            [name]="ICON_NAMES.PLAY"
            size="0.7rem"
          />
        </button>
      </div>
    </div>
  }
</div>
