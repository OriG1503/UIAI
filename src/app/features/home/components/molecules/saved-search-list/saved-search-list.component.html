<div class="saved-search-list">
  <div class="filters">
    <input
      type="text"
      class="filter-input name-input"
      [placeholder]="labels.name"
      [ngModel]="$nameFilter()"
      (ngModelChange)="onNameFilterChange($event)"
    />
    <input
      type="text"
      class="filter-input user-input"
      [placeholder]="labels.user"
      [ngModel]="$userFilter()"
      (ngModelChange)="onUserFilterChange($event)"
    />
    <button
      type="button"
      class="clear-btn"
      [class.disabled]="!$hasFilters()"
      (click)="onClearFilters()"
    >
      {{ labels.clear }}
    </button>
  </div>

  @if ($isLoading()) {
    <div class="loader-container">
      <div class="loader"></div>
    </div>
  } @else {
  <div class="list">
    @for (search of $filteredSavedSearches(); track search.name; let i = $index) {
      <div class="saved-search-item">
        <div class="unseen-indicator"></div>

        <div class="item-content">
          <button
            type="button"
            class="pin-btn"
            (click)="onTogglePin(search)"
          >
            <app-icon
              [name]="ICON_NAMES.THUMBTACK"
              size="0.75rem"
              [color]="search.isPinned ? 'var(--color-red)' : 'var(--color-dark-navy)'"
            />
          </button>

          <span
            class="saved-search-name"
            dir="auto"
          >{{ search.name }}</span>

          <span
            class="saved-search-username"
            dir="ltr"
          >{{ search.username }}</span>

          <span
            class="saved-search-date"
            dir="ltr"
          >{{ formatDate(search.date) }}</span>

          <div class="item-actions">
            <button
              type="button"
              class="play-btn"
              [class.hidden]="$openMenuIndex() === i"
            >
              <app-icon
                [name]="ICON_NAMES.PLAY"
                size="0.7rem"
              />
            </button>

            <div class="actions-wrapper">
              <button
                type="button"
                class="dots-btn"
                [class.open]="$openMenuIndex() === i"
                (click)="onToggleMenu(i)"
              >
                <app-icon
                  [name]="ICON_NAMES.ELLIPSIS_V"
                  size="0.7rem"
                  [color]="$openMenuIndex() === i ? 'var(--color-white)' : 'var(--color-dark-navy)'"
                />
              </button>

              <div
                class="actions-slider"
                [class.open]="$openMenuIndex() === i"
              >
                <button
                  type="button"
                  class="slider-btn"
                >
                  <app-icon
                    [name]="ICON_NAMES.PENCIL"
                    size="0.65rem"
                  />
                </button>
                <button
                  type="button"
                  class="slider-btn"
                >
                  <app-icon
                    [name]="ICON_NAMES.COPY"
                    size="0.65rem"
                  />
                </button>
                <button
                  type="button"
                  class="slider-btn"
                >
                  <app-icon
                    [name]="ICON_NAMES.TRASH"
                    size="0.65rem"
                  />
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
  }
</div>
