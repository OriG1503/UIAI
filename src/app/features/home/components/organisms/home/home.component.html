<div class="home">
  <div class="top-left-actions">
    <app-theme-toggle />
    <app-alert-button
      (openIssue)="onOpenIssue()"
      (openRequest)="onOpenRequest()"
    />
  </div>

  <div class="top-section">
    <div class="logo-container">
      <img
        src="assets/logo.png"
        alt="Logo"
        class="home-logo"
      />
    </div>
    <div class="search-bar-container">
      <app-search-bar
        [isLeftSectionVisible]="false"
        [isLogoVisible]="false"
        variant="embedded"
      />
    </div>
  </div>

  <div class="bottom-section"></div>
</div>
