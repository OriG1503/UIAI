<div class="switch-container">
  <button
    type="button"
    class="switch-btn switch-btn-agent"
    [class.switch-btn-active]="$mode() === 'agent'"
    (click)="onModeSelect('agent'); geminiRain.onGeminiClick($event)"
  >
    <span class="agent-label">{{ labels.agent }}</span>
    <app-gemini-rain #geminiRain />
  </button>
  <button
    type="button"
    class="switch-btn switch-btn-search"
    [class.switch-btn-active]="$mode() === 'regular' || $mode() === 'advanced'"
    (click)="onModeSelect('regular')"
  >
    {{ labels.regular }}
  </button>
</div>
