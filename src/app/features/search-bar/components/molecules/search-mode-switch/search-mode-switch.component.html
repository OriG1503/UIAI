<div class="switch-container">
  <button
    type="button"
    class="switch-btn switch-btn-agent"
    [class.switch-btn-active]="$mode() === 'agent'"
    (click)="onModeSelect('agent'); onGeminiClick($event)"
  >
    <span class="agent-label">{{ labels.agent }}</span>
    <app-gemini-icon size="0.75rem" />
  </button>
  <button
    type="button"
    class="switch-btn switch-btn-search"
    [class.switch-btn-active]="$mode() === 'regular'"
    (click)="onModeSelect('regular')"
  >
    {{ labels.regular }}
  </button>
</div>
