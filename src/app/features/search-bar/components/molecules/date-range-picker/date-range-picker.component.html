<div class="date-range-wrapper">
  <button
    type="button"
    class="date-btn"
    [class.date-btn-open]="$isPopupOpen()"
    [class.date-btn-has-data]="$isActive()"
    (click)="togglePopup()"
  >
    <app-icon
      [name]="ICON_NAMES.CALENDAR"
      size="0.85rem"
      [color]="$calendarIconColor()"
    />
    <span class="date-btn-label">
      {{ $buttonLabel() }}
    </span>
    <app-icon
      [name]="$isPopupOpen() ? ICON_NAMES.CHEVRON_UP : ICON_NAMES.CHEVRON_DOWN"
      [size]="ICON_SIZE_XS"
      [color]="$chevronIconColor()"
    />
  </button>

  @if ($isPopupOpen()) {
    <div class="popup-container">
      <div class="mode-toggle">
        <button
          type="button"
          class="toggle-btn"
          [class.toggle-btn-active]="$selectedMode() === 'verbal'"
          (click)="selectMode('verbal')"
        >
          {{ modeLabels.verbal }}
        </button>
        <button
          type="button"
          class="toggle-btn"
          [class.toggle-btn-active]="$selectedMode() === 'calendar'"
          (click)="selectMode('calendar')"
        >
          {{ modeLabels.calendar }}
        </button>
      </div>

      <div class="radio-group">
        <div class="radio-option">
          <button
            type="button"
            class="radio-btn"
            [class.radio-btn-active]="$selectedOption() === 'option1'"
            (click)="selectOption('option1')"
          >
            <span class="radio-dot"></span>
          </button>
          <span class="radio-label">{{ optionLabels.option1 }}</span>
        </div>
        <div class="radio-option">
          <button
            type="button"
            class="radio-btn"
            [class.radio-btn-active]="$selectedOption() === 'option2'"
            (click)="selectOption('option2')"
          >
            <span class="radio-dot"></span>
          </button>
          <span class="radio-label">{{ optionLabels.option2 }}</span>
        </div>
      </div>

      <div class="divider"></div>

      @if ($selectedMode() === 'calendar') {
        <app-calendar-view
          [dateRange]="$dateRange()"
          (dateSelect)="onCalendarSelect($event)"
        />
      } @else if ($selectedMode() === 'verbal') {
        <app-verbal-view (verbalChange)="onVerbalChange($event)" />
      }
    </div>
  }
</div>
